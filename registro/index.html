<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>

    <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" required autocomplete="name"
               aria-describedby="nombre-error">
        <p id="nombre-error" class="error" aria-live="polite"></p>
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
               autocomplete="new-password" aria-describedby="password-error">
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" name="confirmar" type="password" required
               autocomplete="new-password" aria-describedby="confirmar-error">
        <p id="confirmar-error" class="error" aria-live="polite"></p>
      </div>

      <div class="campo">
        <label for="edad">Edad</label>
        <input id="edad" name="edad" type="number" required inputmode="numeric"
               aria-describedby="edad-error">
        <p id="edad-error" class="error" aria-live="polite"></p>
      </div>

      <div class="campo">
        <label for="pais">País</label>
        <!-- La primera opción tiene value="" para que cuente como «no elegido» -->
        <select id="pais" name="pais" required autocomplete="country-name"
                aria-describedby="pais-error">
          <option value="">Elige un país</option>
          <option value="AR">Argentina</option>
          <option value="BO">Bolivia</option>
          <option value="CL">Chile</option>
          <option value="CO">Colombia</option>
          <option value="EC">Ecuador</option>
          <option value="ES">España</option>
          <option value="MX">México</option>
          <option value="PE">Perú</option>
          <option value="UY">Uruguay</option>
          <option value="VE">Venezuela</option>
        </select>
        <p id="pais-error" class="error" aria-live="polite"></p>
      </div>

      <fieldset class="telefonos">
        <legend>Teléfonos (opcional)</legend>
        <!-- app.js agrega hasta 3 filas con name=telefono -->
        <div id="telefonos"></div>
        <button type="button" id="agregar-telefono" class="secundario"
                aria-describedby="telefonos-ayuda">Agregar teléfono</button>
        <p id="telefonos-ayuda" class="ayuda">Puedes agregar hasta 3 teléfonos.</p>
      </fieldset>

      <div class="campo">
        <div class="campo-check">
          <input id="terminos" name="terminos" type="checkbox" required
                 aria-describedby="terminos-error">
          <label for="terminos">Acepto los términos y condiciones</label>
        </div>
        <p id="terminos-error" class="error" aria-live="polite"></p>
      </div>

      <button type="submit">Crear cuenta</button>
      <p id="mensaje" role="status"></p>
    </form>

    <!-- saludo despues del registro y app.js lo llena con textContent -->
    <p id="saludo" class="saludo"></p>
  </main>
  <!-- type=module permite usar import,  se tiene que abrir la pagina con Live Server -->
  <script type="module" src="app.js"></script>
</body>
</html>
